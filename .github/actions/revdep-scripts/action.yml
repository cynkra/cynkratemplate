name: "Locate the revdep scripts"
description: >
  Export the directories holding the scripts of the `revdep2`, `revdep4` and `revdepx` workflows
  as `REVDEP2_DIR`, `REVDEP4_DIR` and `REVDEPX_DIR`, for the later steps of the calling job.

runs:
  using: "composite"
  steps:
    - name: Export the script directories
      # The scripts live beside this action, in `.github/actions/revdep2` and its siblings,
      # and the runner fetched them together with it, from the ref the caller named.
      # A workflow cannot name that location itself, hence this action.
      run: |
        root=$(cd -- "${{ github.action_path }}/.." && pwd -P)
        for name in revdep2 revdep4 revdepx; do
          echo "$(printf '%s' "${name}" | tr '[:lower:]' '[:upper:]')_DIR=${root}/${name}" | tee -a "${GITHUB_ENV}"
        done
      shell: bash
