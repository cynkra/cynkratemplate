name: "Action to create documentation with roxygen2"
description: >
  This action regenerates the documentation with `roxygen2::roxygenize()`.
  roxygen2 has no strict mode, so the warnings it emits are collected,
  and the step fails if there are any.
  Deprecation warnings are annotated, but they do not fail the step.

runs:
  using: "composite"
  steps:
    - name: Roxygenize
      run: |
        ## -- Roxygenize --
        # roxygen2 offers no strict mode, and `options(warn = 2)` is the wrong
        # tool here: it would abort at the first warning, before the
        # documentation is written, and it would also catch warnings unrelated
        # to roxygenize(), e.g. from loading the package. Collecting the
        # warnings of the roxygenize() call keeps the generated documentation,
        # which the commit step still picks up, and fails the step afterwards.
        #
        # Deprecation warnings are carved out of that gate. A third-party
        # roclet such as `devtag` can call a function that roxygen2 has
        # deprecated, and the package that merely uses the roclet has no way
        # to act on it -- the fix belongs in the roclet, not here. They are
        # still annotated, so they stay visible and can be chased upstream.
        # The match is on the condition class, never on the message text:
        # `.Deprecated()` signals a `deprecatedWarning`, and
        # `lifecycle::deprecate_warn()` a `lifecycle_warning_deprecated`,
        # while an ordinary `warning()` carries neither.
        deprecated <- c("deprecatedWarning", "lifecycle_warning_deprecated")

        warns <- character()
        depr <- character()

        # Everything from here on calls base functions as `base::fun()`.
        # roxygen2 loads the package with `pkgload::load_all()`, which *attaches*
        # `package:<pkg>` to the search path -- with `export_all = TRUE`, so the
        # internal objects land there too -- and roxygen2 never detaches it.
        # This script is evaluated in the global environment, whose parent is
        # that search path, so an unqualified base call made from the
        # `withCallingHandlers()` call onwards can resolve to an object of the
        # package being documented. cynkra/dd, which generates a stub per DuckDB
        # function, defines `length()` among 60-odd other base names, so
        # `length(depr)` below errored there before any warning was even seen.
        # The warning handler needs the same treatment: it runs while
        # roxygenize() is still going, and by then the package is attached.
        # Local variables (`deprecated`, `warns`, `depr`, `escape`) live in the
        # global environment itself, which is searched first, so they are safe.
        # Operators and control flow stay unqualified -- see the pull request
        # that introduced this for where that line is drawn.
        base::withCallingHandlers(
          roxygen2::roxygenize(),
          warning = function(w) {
            # `base::inherits(w, deprecated)` is `any(class(w) %in% deprecated)`
            # in a single qualified call, and leaves no `%in%` to be masked.
            if (base::inherits(w, deprecated)) {
              depr <<- base::c(depr, base::conditionMessage(w))
            } else {
              warns <<- base::c(warns, base::conditionMessage(w))
            }
            base::invokeRestart("muffleWarning")
          }
        )

        # Workflow commands are single-line, the payload needs escaping
        escape <- function(x) {
          x <- base::gsub("%", "%25", x, fixed = TRUE)
          x <- base::gsub("\r", "%0D", x, fixed = TRUE)
          base::gsub("\n", "%0A", x, fixed = TRUE)
        }

        if (base::length(depr) > 0) {
          base::writeLines(base::sprintf("roxygen2 emitted %d deprecation warning(s), these do not fail the step:", base::length(depr)))
          base::writeLines(base::paste0("* ", depr))
          base::writeLines(base::sprintf("::warning title=roxygen2 deprecation::%s", escape(depr)))
        }

        if (base::length(warns) == 0) {
          base::writeLines("roxygen2 emitted no warnings that fail the step.")
        } else {
          base::writeLines(base::sprintf("roxygen2 emitted %d warning(s):", base::length(warns)))
          base::writeLines(base::paste0("* ", warns))
          base::writeLines(base::sprintf("::warning title=roxygen2::%s", escape(warns)))

          base::stop("Fix the roxygen2 warnings above.", call. = FALSE)
        }
      shell: Rscript {0}
