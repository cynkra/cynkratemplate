name: "Actions to compute a matrix with all R and OS versions"
description: >
  Compute the matrix of operating systems and R versions the full check runs over.

inputs:
  covr:
    description: >
      Whether to add the default covr entry.
      `false` from a workflow that computes the coverage in its smoke test instead.
      Entries a repository adds in `.github/versions-matrix.R` are kept either way.
      The default keeps workflows that predate this input unchanged.
    required: false
    default: "true"

outputs:
  matrix:
    description: "Generated matrix"
    value: ${{ steps.set-matrix.outputs.matrix }}

runs:
  using: "composite"
  steps:
    - name: Install json2yaml
      run: |
        sudo npm install -g json2yaml
      shell: bash

    - name: Collect the R versions to check
      id: set-matrix
      # The script sits beside this file, and the runner fetched both together.
      # It runs in the workspace, so it reads the package being checked.
      env:
        VERSIONS_MATRIX_COVR: ${{ inputs.covr }}
      run: |
        Rscript "${{ github.action_path }}/action.R"
      shell: bash
