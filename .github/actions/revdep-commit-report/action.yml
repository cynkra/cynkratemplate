name: "Retired: no longer commits the revdep report"
description: >
  Retired. `revdep2` and `revdep4` no longer commit their report to the
  checked branch, because a commit there moved a release branch's head and
  made the checks run again. The report stays in the run, on its summary page
  and in its report artifact, and `revdep-release-comment` points the release
  pull request at it.

  Kept as a step that does nothing, so that a copy of a workflow that still
  calls it keeps running until it is updated from cynkra/cynkratemplate;
  delete this directory once no workflow refers to it.

inputs:
  ref:
    description: "Ignored."
    required: false
    default: ""
  workflow:
    description: "Ignored."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Do not commit the report
      run: |
        echo "::notice::The revdep report is no longer committed; it is in this run's summary and report artifact. Update this workflow from cynkra/cynkratemplate to drop this step."
      shell: bash
