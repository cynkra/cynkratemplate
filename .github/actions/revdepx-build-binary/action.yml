name: "Build the binary in the base container"
description: >
  Build the package under test inside the base image, so that the shards check
  against the same binary rather than each building their own.

inputs:
  base-image:
    description: "The base image to build in."
    required: true

runs:
  using: "composite"
  steps:
    - name: "Build the binary in the base container"
      id: main
      env:
        BASE_IMAGE: ${{ inputs.base-image }}
      run: |
        set -eu
        mkdir -p "${RUNNER_TEMP}/pkg" "${RUNNER_TEMP}/pak-cache" \
          "${RUNNER_TEMP}/ccache"
        # The scripts come from beside this action, not from the workspace.
        # CCACHE_MAXSIZE is a budget, not an estimate: a repository gets
        # 10 GB of Actions cache in total and the universe job's pak cache
        # already spends more than two of them, so a compiler cache that
        # grew without a ceiling would evict the very thing it shares the
        # budget with. ccache compresses what it stores; raise this if the
        # cache size in the build summary's statistics nears the 2G limit.
        # CCACHE_NOHASHDIR and CCACHE_SLOPPINESS as in
        # .github/actions/install/action.yml, which says why: R CMD INSTALL
        # compiles in a fresh temporary directory, and with `-g` ccache hashes
        # that directory into every key, so without them nothing ever hits.
        docker run --rm \
          -v "$(cd -- "${{ github.action_path }}/../revdepx" && pwd -P):/revdepx/scripts:ro" \
          -v "${GITHUB_WORKSPACE}:/revdepx/src" \
          -v "${RUNNER_TEMP}/pkg:/revdepx/pkg-out" \
          -v "${RUNNER_TEMP}/pak-cache:/root/.cache/R/pkgcache" \
          -v "${RUNNER_TEMP}/ccache:/revdepx/ccache" \
          -w /revdepx/src \
          -e REVDEPX_BUILD_DEPS=1 \
          -e PKG_SYSREQS=true \
          -e OUT_DIR=/revdepx/pkg-out \
          -e CCACHE_DIR=/revdepx/ccache \
          -e CCACHE_MAXSIZE=2G \
          -e CCACHE_NOHASHDIR=true \
          -e CCACHE_SLOPPINESS=locale,time_macros \
          -e GITHUB_SHA \
          "${BASE_IMAGE}" \
          Rscript /revdepx/scripts/build.R
        # Root in the container wrote the pak cache, and its 600 lock
        # files defeat the cache post-step's tar ("Permission denied",
        # save skipped). Hand the tree back to the runner user. The
        # compiler cache is root-written for the same reason and needs the
        # same handover.
        sudo chown -R "$(id -u):$(id -g)" \
          "${RUNNER_TEMP}/pak-cache" "${RUNNER_TEMP}/ccache" || true
      shell: bash
